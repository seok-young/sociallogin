server:
  servlet:
    encoding:
      charset: utf-8
      force: true
  port: 8080


spring:
  datasource:
    url: jdbc:h2:mem:test;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create
    properties:
      '[hibernate.default_batch_fetch_size]': 100
      '[hibernate.format_sql]': true
    show-sql: true
  output:
    ansi:
      enabled: always
  # 로그인 및 인증
  oauth2:
    kakao:
      url:
        auth: "${application.spring.security.kakao.url.auth}"
        api: "${application.spring.security.kakao.url.api}"
        redirect-uri: http://localhost:8080/kakao/callback
      client-id: "${application.spring.security.kakao.client-id}"

    naver:
      url:
        auth: "${application.spring.security.naver.url.auth}"
        api: "${application.spring.security.naver.url.api}"
        redirect-uri: "${application.spring.security.naver.url.redirect-uri}"
      client-id: "${application.spring.security.naver.client-id}"
      client-secret: "${application.spring.security.naver.client-secret}"

  jwt:
    secret-key: "${application.spring.security.jwt.secret-key}"

  accessToken:
    expirationSeconds: "${application.spring.security.accssToken.expirationSeconds}"



logging:
  file:
    name: logs/applicaion.log
  level:
    '[com.example.server]': DEBUG
    '[org.hibernate.type]': TRACE


